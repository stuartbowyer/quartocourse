[project]
name = "quartocourse"
version = "0.1.0"
description = "Render Jupyter notebooks into reveal.js lecture slides and Typst PDF lecture notes via Quarto."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stuart Bowyer" }]
keywords = ["quarto", "jupyter", "notebook", "slides", "teaching", "typst", "revealjs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]

dependencies = [
    "pyyaml>=6.0",
    # Render-time execution ([execute]). ipykernel is for the default kernel,
    # which runs on quartocourse's own interpreter.
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
# Pins the whole external toolchain. Quarto's own distribution bundles the
# exact pandoc, typst, deno and dart-sass it requires (see README > Toolchain),
# so pinning quarto pins everything. quarto-cli is an sdist whose setup.py
# downloads the matching release from GitHub at install time -- it therefore
# needs network access and is incompatible with --require-hashes.
quarto = ["quarto-cli==1.9.37"]

[project.scripts]
quartocourse = "quartocourse.cli:main"

[project.urls]
Homepage = "https://github.com/stuartbowyer/quartocourse"
Issues = "https://github.com/stuartbowyer/quartocourse/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quartocourse"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# src layout: without this, `quartocourse` is classified as third-party.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W"]
