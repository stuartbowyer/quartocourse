name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12

      - run: uv run --no-sync ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately without --extra quarto. quarto-cli is an sdist whose
      # setup.py downloads the matching Quarto release from GitHub at install
      # time; none of the tests need it, and pulling ~100MB per matrix leg
      # would make CI slow and dependent on GitHub's release CDN.
      - run: uv sync --python ${{ matrix.python-version }}

      - run: uv run --no-sync pytest
